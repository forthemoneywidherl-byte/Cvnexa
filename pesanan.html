<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pesanan — CVNexa</title><link rel="stylesheet" href="style.css"></head>
<body><header class="pagehead"><a href="index.html">‹</a><h1>Pesanan</h1><span></span></header><main class="formwrap" id="orders"></main><nav class="bottom"><a href="index.html">⌂<small>Template</small></a><a class="active" href="pesanan.html">▣<small>Pesanan</small></a><a href="kontak.html">◉<small>Admin</small></a></nav>
<script src="app.js"></script><script>const o=JSON.parse(localStorage.getItem("cv_order")||"null"),box=document.getElementById("orders");if(!o)box.innerHTML='<div class="empty"><div>▣</div><h2>Belum ada pesanan</h2><p>Pilih template CV untuk memulai.</p><a class="submit link" href="index.html">Pilih Template</a></div>';else{const t=getAllTemplates().find(x=>x.id===o.template)||getAllTemplates()[0];box.innerHTML=`<div class="order"><img class="orderimg" src="${t.image}"><span class="status">Siap dikirim</span><h2>${esc(t.name)}</h2><p>${esc(o.name)}</p><strong>${money(t.price)}</strong><button class="submit" onclick="sendOrder(o,t)">Kirim ulang ke WhatsApp</button></div>`}</script></body></html>
