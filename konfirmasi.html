<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Konfirmasi — CVNexa</title><link rel="stylesheet" href="style.css"></head>
<body><header class="pagehead"><a href="index.html">‹</a><h1>Konfirmasi</h1><span></span></header><main class="formwrap"><div id="summary" class="summary"></div><button class="submit" id="send">📱 Kirim Pesanan ke WhatsApp Admin</button><p class="smallcenter">Admin akan menerima template yang dipilih dan semua data CV.</p></main>
<script src="app.js"></script><script>
const o=JSON.parse(localStorage.getItem("cv_order")||"null");if(!o)location.href="index.html";else{const t=getAllTemplates().find(x=>x.id===o.template)||getAllTemplates()[0];document.getElementById("summary").innerHTML=`<div class="chosen"><div class="thumb"><img src="${t.image}"></div><div><span class="eyebrow">TEMPLATE</span><h2>${esc(t.name)}</h2><p>${esc(t.category)} • ${money(t.price)}</p></div></div><hr><div class="sum"><span>Nama</span><b>${esc(o.name)}</b></div><div class="sum"><span>WhatsApp</span><b>${esc(o.phone)}</b></div><div class="sum"><span>Posisi</span><b>${esc(o.position)}</b></div><div class="sum"><span>Pendidikan</span><b>${esc(o.education)}</b></div><div class="sum"><span>Pengalaman</span><b>${esc(o.experience)}</b></div><div class="sum"><span>Skill</span><b>${esc(o.skills)}</b></div>`;document.getElementById("send").onclick=()=>sendOrder(o,t)}
</script></body></html>
