<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Template — CVNexa</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="pagehead"><a href="index.html">‹</a><h1>Kelola Template</h1><span></span></header>
<main class="formwrap">
<div style="text-align:right;margin-bottom:10px"><button class="adminlogout" onclick="sessionStorage.removeItem('cv_admin_login');location.href='login.html'">Keluar</button></div>
<script>if(sessionStorage.getItem("cv_admin_login")!=="yes")location.href="login.html";</script>
<div class="adminintro"><span>⚙️</span><div><h2>Tambah Template CV</h2><p>Template disimpan online agar muncul di semua HP.</p></div></div>
<form id="templateForm"><label>Nama template<input name="name" required placeholder="Contoh: CV Elegant Blue"></label><label>Kategori<select name="category"><option>ATS</option><option>Modern</option><option>Creative</option><option>Formal</option></select></label><label>Harga<input name="price" required type="number" min="0" placeholder="50000"></label><label>Gambar CV<input id="image" type="file" accept="image/*" required></label><div id="preview" class="uploadpreview">Pilih gambar CV untuk melihat preview.</div><button class="submit" type="submit">＋ Tambahkan ke Katalog</button></form>
<h2 class="listtitle">Template tambahan</h2><div id="customList"><div class="empty smallempty">Memuat template...</div></div>
<div class="notice">☁️ Template baru disimpan di database + Storage Supabase sehingga bisa muncul di perangkat lain.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script <script src="app_supabase_final.js"></script>
<script>
const input=document.getElementById("image"),preview=document.getElementById("preview");
input.onchange=()=>{const f=input.files[0];if(f){const r=new FileReader();r.onload=()=>preview.innerHTML='<img src="'+r.result+'">';r.readAsDataURL(f)}};
async function renderAdmin(){const list=document.getElementById("customList");await loadCustomTemplates();if(!cloudTemplates.length){list.innerHTML='<div class="empty smallempty">Belum ada template tambahan.</div>';return}list.innerHTML=cloudTemplates.map(t=>`<div class="adminitem"><img src="${t.image}"><div><b>${esc(t.name)}</b><small>${esc(t.category)} • ${money(t.price)}</small></div><button onclick="removeTemplate('${t.id}')">Hapus</button></div>`).join("")}
async function removeTemplate(id){if(!confirm("Hapus template ini dari katalog?"))return;const item=cloudTemplates.find(x=>x.id===id);if(!item)return;const {error}=await supabaseClient.from("cv_templates").delete().eq("id",id);if(error){alert("Gagal menghapus template: "+error.message);return}if(item.storage_path)await supabaseClient.storage.from("cv-templates").remove([item.storage_path]);await renderAdmin();alert("Template berhasil dihapus.")}
document.getElementById("templateForm").onsubmit=async e=>{e.preventDefault();const form=e.target,f=new FormData(form),file=input.files[0];if(!file)return;if(!file.type.startsWith("image/")){alert("File harus berupa gambar.");return}if(file.size>6*1024*1024){alert("Ukuran gambar maksimal 6 MB.");return}const button=form.querySelector("button[type=submit]");button.disabled=true;button.textContent="Mengupload...";try{const safe=file.name.toLowerCase().replace(/[^a-z0-9._-]/g,"-");const path=Date.now()+"-"+safe;const up=await supabaseClient.storage.from("cv-templates").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type});if(up.error)throw up.error;const url=supabaseClient.storage.from("cv-templates").getPublicUrl(path).data.publicUrl;const ins=await supabaseClient.from("cv_templates").insert({name:f.get("name"),category:f.get("category"),price:Number(f.get("price")),image_url:url,storage_path:path});if(ins.error){await supabaseClient.storage.from("cv-templates").remove([path]);throw ins.error}form.reset();preview.innerHTML="Pilih gambar CV untuk melihat preview.";await renderAdmin();alert("Template berhasil ditambahkan dan tersimpan online.")}catch(err){console.error(err);alert("Gagal menambahkan template: "+(err.message||err))}finally{button.disabled=false;button.textContent="＋ Tambahkan ke Katalog"}};
renderAdmin();
</script></body></html>
